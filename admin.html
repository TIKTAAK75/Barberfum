<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت - پیرایش باربرفان</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #f1c40f;
            --accent-color: #e67e22;
            --danger-color: #dc3545;
            --success-color: #28a745;
            --bg-color: #ecf0f1;
            --font-family: 'Tahoma', sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1, h2, h3 {
            color: var(--primary-color);
            text-align: center;
        }

        .login-card {
            max-width: 350px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .section {
            border-top: 2px solid #eee;
            padding-top: 20px;
            margin-top: 25px;
        }

        .days-select {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .day-btn {
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 10px 5px;
            text-align: center;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .day-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .slot-btn {
            padding: 10px 5px;
            border-radius: 5px;
            text-align: center;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            color: white;
        }

        .slot-btn.active-slot {
            background-color: var(--success-color);
        }

        .slot-btn.hidden-slot {
            background-color: #6c757d;
            text-decoration: line-through;
        }

        .slot-btn.booked-slot {
            background-color: var(--danger-color);
        }

        .booking-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 5px;
            border-right: 4px solid var(--primary-color);
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .booking-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .approve-btn {
            background-color: var(--success-color);
            padding: 6px 12px;
            font-size: 0.85rem;
            margin: 0;
        }

        .reject-btn {
            background-color: var(--danger-color);
            padding: 6px 12px;
            font-size: 0.85rem;
            margin: 0;
        }

        .logout-btn {
            background-color: var(--danger-color);
            width: auto;
            float: left;
            padding: 5px 15px;
            font-size: 0.85rem;
        }

        .header-admin {
            overflow: hidden;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div id="loginSection" class="login-card">
    <h2>ورود به پنل ادمین</h2>
    <p style="font-size: 0.85rem; color: #666;">پیرایش باربرفان</p>
    <div class="form-group">
        <label>نام کاربری</label>
        <input type="text" id="usernameInput" placeholder="admin">
    </div>
    <div class="form-group">
        <label>رمز عبور</label>
        <input type="password" id="passwordInput" placeholder="******">
    </div>
    <button onclick="handleLogin()">ورود</button>
</div>

<div id="dashboardSection" class="container" style="display: none;">
    <div class="header-admin">
        <button class="logout-btn" onclick="handleLogout()">خروج</button>
        <h2 style="margin: 0; text-align: right;">پنل مدیریت پیرایش باربرفان</h2>
    </div>

    <div class="section">
        <h3>۱. تنظیم اطلاعیه روی سایت</h3>
        <textarea id="announcementText" rows="2" placeholder="متن اطلاعیه جدید..."></textarea>
        <button onclick="saveAnnouncement()" style="background-color: var(--accent-color);">ذخیره اطلاعیه</button>
    </div>

    <div class="section">
        <h3>۲. مدیریت و تعیین ساعت‌های نوبت‌دهی</h3>
        <p style="font-size: 0.85rem; color: #666;">
            روز مورد نظر را انتخاب کنید و وضعیت ساعت‌ها را تغییر دهید:
        </p>
        <div class="days-select" id="adminDaysGrid"></div>
        <div class="slots-grid" id="adminSlotsGrid"></div>
    </div>

    <div class="section">
        <h3>۳. لیست نوبت‌های ثبت‌شده آنلاین (با قابلیت تایید/رد)</h3>
        <div id="adminBookingsList">
            <p style="text-align:center; color:#888;">هنوز رزروی ثبت نشده است.</p>
        </div>
        <button onclick="clearAllBookings()" style="background-color: var(--danger-color); margin-top:15px;">پاک کردن کلیه سوابق</button>
    </div>

    <p style="text-align: center; margin-top: 25px;">
        <a href="index.html" target="_blank" style="color: var(--primary-color);">مشاهده صفحه اصلی سایت ←</a>
    </p>
</div>

<script>
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "123456";

    let selectedAdminDay = null;
    let customSlotsConfig = JSON.parse(localStorage.getItem('barbarfan_custom_slots') || '{}');
    let bookedTimes = JSON.parse(localStorage.getItem('barbarfan_booked_slots') || '{}');

    function generateMasterTimes() {
        let times = [];
        for(let hour = 10; hour <= 22; hour++) {
            times.push((hour < 10 ? '0' : '') + hour + ':00');
            times.push((hour < 10 ? '0' : '') + hour + ':30');
        }
        times.push('23:00');
        return times;
    }
    const masterTimes = generateMasterTimes();

    function generateDays() {
        let daysArray = [];
        let today = new Date();
        for (let i = 0; i < 4; i++) {
            let d = new Date(today);
            d.setDate(today.getDate() + i);
            let pDayName = new Intl.DateTimeFormat('fa-IR', { weekday: 'long' }).format(d);
            let pDayNum = new Intl.DateTimeFormat('fa-IR', { day: 'numeric' }).format(d);
            let pMonthName = new Intl.DateTimeFormat('fa-IR', { month: 'long' }).format(d);
            let rawDate = d.toISOString().split('T')[0];
            let labelName = (i === 0) ? 'امروز' : (i === 1) ? 'فردا' : pDayName;
            daysArray.push({ name: labelName, date: `${pDayNum} ${pMonthName}`, raw: rawDate, formatted: `${pDayName}، ${pDayNum} ${pMonthName}` });
        }
        return daysArray;
    }

    const days = generateDays();

    function handleLogin() {
        const user = document.getElementById('usernameInput').value;
        const pass = document.getElementById('passwordInput').value;
        if(user === ADMIN_USER && pass === ADMIN_PASS) {
            sessionStorage.setItem('barbarfan_admin_logged_in', 'true');
            showDashboard();
        } else {
            alert('نام کاربری یا رمز عبور اشتباه است!');
        }
    }

    function handleLogout() {
        sessionStorage.removeItem('barbarfan_admin_logged_in');
        location.reload();
    }

    function checkAuth() {
        if(sessionStorage.getItem('barbarfan_admin_logged_in') === 'true') {
            showDashboard();
        }
    }

    function showDashboard() {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        initAdminCalendar();
        loadBookingsList();
    }

    function saveAnnouncement() {
        const text = document.getElementById('announcementText').value;
        if(!text) return alert('لطفاً متنی وارد کنید.');
        localStorage.setItem('barbarfan_announcement', text);
        alert('اطلاعیه با موفقیت در سایت آپدیت شد!');
    }

    function initAdminCalendar() {
        const daysGrid = document.getElementById('adminDaysGrid');
        daysGrid.innerHTML = '';
        days.forEach((day, index) => {
            const btn = document.createElement('div');
            btn.classList.add('day-btn');
            if(index === 0) {
                btn.classList.add('active');
                selectedAdminDay = day.raw;
            }
            btn.innerHTML = `<strong>${day.name}</strong><br>${day.date}`;
            btn.onclick = () => {
                document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedAdminDay = day.raw;
                renderAdminSlots(selectedAdminDay);
            };
            daysGrid.appendChild(btn);
        });
        renderAdminSlots(selectedAdminDay);
    }

    function renderAdminSlots(dateKey) {
        const slotsGrid = document.getElementById('adminSlotsGrid');
        slotsGrid.innerHTML = '';
        
        let hiddenList = customSlotsConfig[dateKey] || [];
        let currentBooked = bookedTimes[dateKey] || [];

        masterTimes.forEach(time => {
            const btn = document.createElement('button');
            btn.classList.add('slot-btn');
            
            if(currentBooked.includes(time)) {
                btn.classList.add('booked-slot');
                btn.innerText = `${time} (رزرو/پر)`;
            } else if(hiddenList.includes(time)) {
                btn.classList.add('hidden-slot');
                btn.innerText = `${time} (مخفی)`;
            } else {
                btn.classList.add('active-slot');
                btn.innerText = `${time} (فعال)`;
            }

            btn.onclick = () => cycleSlotStatus(dateKey, time);
            slotsGrid.appendChild(btn);
        });
    }

    function cycleSlotStatus(dateKey, time) {
        if(!customSlotsConfig[dateKey]) customSlotsConfig[dateKey] = [];
        if(!bookedTimes[dateKey]) bookedTimes[dateKey] = [];

        let hiddenList = customSlotsConfig[dateKey];
        let bookedList = bookedTimes[dateKey];

        let isBooked = bookedList.includes(time);
        let isHidden = hiddenList.includes(time);

        if(!isHidden && !isBooked) {
            hiddenList.push(time);
        } else if(isHidden && !isBooked) {
            const index = hiddenList.indexOf(time);
            if(index > -1) hiddenList.splice(index, 1);
            bookedList.push(time);
        } else {
            const index = bookedList.indexOf(time);
            if(index > -1) bookedList.splice(index, 1);
        }

        localStorage.setItem('barbarfan_custom_slots', JSON.stringify(customSlotsConfig));
        localStorage.setItem('barbarfan_booked_slots', JSON.stringify(bookedTimes));
        renderAdminSlots(dateKey);
    }

    function loadBookingsList() {
        const container = document.getElementById('adminBookingsList');
        let list = JSON.parse(localStorage.getItem('barbarfan_bookings') || '[]');

        if(list.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#888;">هنوز هیچ نوبتی آنلاین ثبت نشده است.</p>';
            return;
        }

        container.innerHTML = '';
        list.forEach((item, index) => {
            // Convert raw date (YYYY-MM-DD) to Persian formatted string if possible
            let foundDay = days.find(d => d.raw === item.date);
            let displayDate = foundDay ? foundDay.formatted : item.date;

            const card = document.createElement('div');
            card.classList.add('booking-item');
            card.innerHTML = `
                <strong>نام مشتری:</strong> ${item.name} | <strong>تلفن:</strong> ${item.phone}<br>
                <strong>تاریخ و ساعت:</strong> ${displayDate} ساعت ${item.time}<br>
                <strong>۴ رقم کارت بیعانه:</strong> <span style="color:red; font-weight:bold;">${item.lastFour}</span><br>
                <div class="booking-actions">
                    <button class="approve-btn" onclick="approveBooking(${index})">تایید و قفل نوبت</button>
                    <button class="reject-btn" onclick="rejectBooking(${index})">رد و آزاد کردن</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function approveBooking(index) {
        let list = JSON.parse(localStorage.getItem('barbarfan_bookings') || '[]');
        let booking = list[index];

        // Automatically lock the slot in bookedTimes so it becomes red on the site
        if(!bookedTimes[booking.date]) bookedTimes[booking.date] = [];
        if(!bookedTimes[booking.date].includes(booking.time)) {
            bookedTimes[booking.date].push(booking.time);
            localStorage.setItem('barbarfan_booked_slots', JSON.stringify(bookedTimes));
        }

        alert(`نوبت ${booking.name} برای ساعت ${booking.time} تایید و به صورت خودکار روی سایت بسته (رزرو) شد.`);
        loadBookingsList();
        renderAdminSlots(selectedAdminDay);
    }

    function rejectBooking(index) {
        if(confirm('آیا از رد این نوبت اطمینان دارید؟ (ساعت مربوطه آزاد خواهد شد)')) {
            let list = JSON.parse(localStorage.getItem('barbarfan_bookings') || '[]');
            let booking = list[index];

            // Free up the slot if it was booked
            if(bookedTimes[booking.date]) {
                bookedTimes[booking.date] = bookedTimes[booking.date].filter(t => t !== booking.time);
                localStorage.setItem('barbarfan_booked_slots', JSON.stringify(bookedTimes));
            }

            // Remove from bookings list
            list.splice(index, 1);
            localStorage.setItem('barbarfan_bookings', JSON.stringify(list));

            alert('نوبت رد شد و ساعت آن مجدداً آزاد گردید.');
            loadBookingsList();
            renderAdminSlots(selectedAdminDay);
        }
    }

    function clearAllBookings() {
        if(confirm('آیا از پاک کردن کل سوابق اطمینان دارید؟')) {
            localStorage.removeItem('barbarfan_bookings');
            localStorage.removeItem('barbarfan_booked_slots');
            bookedTimes = {};
            loadBookingsList();
            renderAdminSlots(selectedAdminDay);
            alert('اطلاعات پاک شد.');
        }
    }

    checkAuth();
</script>
</body>
</html>
